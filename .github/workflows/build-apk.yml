# Telegram Android — GitHub Actions：构建 APK（方案A 无混淆）并同步到 GitHub Release
#
# 约束：不修改仓库任何代码，本 yml 是唯一新增文件。
#   方案A（关闭 R8 混淆 + 资源瘦身）由构建步骤注入 Gradle init 脚本实现
#   （写在 $RUNNER_TEMP，不进仓库，效果等同改 minifyEnabled false）。
#
# 构建内容（除 Play AAB、Beta 外的全部版本，共 3 个 APK）：
#   主版 / web 版 / 华为版
#
# 设计依据（6 个 Telegram fork 的 workflow 调研 + GitHub 官方文档）：
#   - 不清磁盘：官方 runner 可用空间 14GB 足够，6 家 fork 中 3 家完全不清照样构建；
#     需要时再按 forkgram 形态（free-disk-space 且 android:false）加回
#   - 不装 SDK 组件、不缓存 NDK：platform-36 / build-tools 36.0.0 用镜像预装；
#     钉死的 NDK 27.2.12479018 / CMake 3.22.1 依赖 AGP 自动下载（镜像 license
#     已接受，fork 中 2 家未装 cmake 照跑）。⚠ 首跑若报 NDK not found，
#     需把 sdkmanager 安装步加回
#   - actions 全部 Node24 代际：checkout@v6 / setup-java@v5 / upload-artifact@v5 /
#     gradle/actions setup-gradle@v6 / softprops gh-release@v3 → 消除 Node20 弃用警告
#   - 签名开箱即用（仓库自带 keystore）；对外分发建议换自己的 key，见构建步骤注释
#   - 私有仓库 runner 仅 8GB 内存：构建命令用 -Xmx4g 覆盖 gradle.properties 的 8g

name: Build Telegram APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag（留空则只上传 Artifact）'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

env:
  NO_MINIFY_INIT: ${{ runner.temp }}/no-minify.init.gradle

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      # ── 1. 代码与全部子模块（media 模块 / jlatexmath 是 Gradle 配置期依赖，缺一不可）──
      - name: Checkout（含全部子模块）
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: recursive

      - name: 子模块二次保险（forkgram/Qorvhex 做法）
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1

      # ── 2. JDK 17 + Gradle 官方缓存（Node24）──
      - name: 设置 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 设置 Gradle（依赖与构建缓存）
        uses: gradle/actions/setup-gradle@v6

      # ── 3. 方案A：生成"无混淆" init 脚本（运行时注入，仓库文件零改动）──
      - name: 生成方案A 无混淆 init 脚本
        shell: bash
        run: |
          cat > "$NO_MINIFY_INIT" <<'GROOVY'
          // 方案A：CI 运行时关闭代码混淆与资源瘦身，不修改仓库代码。
          // 在 beforeProject 中注册 afterEvaluate，保证先于 AGP 的变体创建执行，
          // 把所有 application 模块各 buildType 的 minifyEnabled/shrinkResources 覆盖为 false。
          gradle.beforeProject { proj ->
              proj.afterEvaluate {
                  if (proj.plugins.hasPlugin('com.android.application')) {
                      proj.android.buildTypes.all { bt ->
                          bt.minifyEnabled = false
                          bt.shrinkResources = false
                          println("[no-minify] ${proj.path} : ${bt.name}")
                      }
                  }
              }
          }
          GROOVY
          echo "已生成 $NO_MINIFY_INIT:"
          cat "$NO_MINIFY_INIT"

      - name: chmod gradlew
        run: chmod +x gradlew

      # ── 4. 构建：主版 / web 版 / 华为版（均为官方 Dockerfile 验证过的任务）──
      # 换用自己的签名时：把 gradle.properties 里的明文密码改成
      # -PRELEASE_STORE_PASSWORD="${{ secrets.… }}" 形式追加到下面命令即可
      - name: 构建主版 / web 版 / 华为版（方案A 无混淆）
        run: |
          ./gradlew --stacktrace \
            -I "$NO_MINIFY_INIT" \
            -Dorg.gradle.jvmargs=-Xmx4g \
            :TMessagesProj_App:assembleAfatRelease \
            :TMessagesProj_AppStandalone:assembleAfatStandalone \
            :TMessagesProj_AppHuawei:assembleAfatRelease

      - name: 失败时输出 CMake / Ninja 日志（Qorvhex 做法）
        if: failure()
        run: |
          echo "=== CMake / Ninja logs ==="
          find TMessagesProj/.cxx -type f \( -name '*.log' -o -name '*.txt' \) 2>/dev/null \
            | head -n 20 | while IFS= read -r f; do echo "--- $f ---"; tail -n 100 "$f"; done

      # ── 5. 打包：主/web/华为 必须存在（Telegraher 式 verify）；
      #      同时检测 mapping.txt 验证方案A 是否真正生效 ──
      - name: 打包产物
        shell: bash
        run: |
          set -euo pipefail
          VN="$(grep -m1 '^APP_VERSION_NAME=' gradle.properties | cut -d= -f2-)"
          VC="$(grep -m1 '^APP_VERSION_CODE=' gradle.properties | cut -d= -f2-)"
          SHA="$(git rev-parse --short HEAD)"
          NAME="telegram-${VN}-${VC}-${SHA}"
          mkdir -p dist

          req() {
            if [ -f "$1" ]; then
              cp "$1" "dist/$2"
            else
              echo "::error::缺少产物 $2（预期路径：$1）"
              find "$(dirname "$1")/.." -type f 2>/dev/null | head -n 30 >&2 || true
              return 1
            fi
          }
          req "TMessagesProj_App/build/outputs/apk/afat/release/app.apk"             "${NAME}.apk"
          req "TMessagesProj_AppStandalone/build/outputs/apk/afat/standalone/app.apk" "${NAME}-web.apk"
          req "TMessagesProj_AppHuawei/build/outputs/apk/afat/release/app-huawei.apk" "${NAME}-huawei.apk"

          # 方案A 自检：出现 mapping.txt 说明混淆没关掉
          if find TMessagesProj_App/build/outputs/mapping -name 'mapping.txt' 2>/dev/null | grep -q .; then
            echo "::warning::检测到 mapping.txt —— 方案A（无混淆）init 脚本可能未生效"
          fi

          (cd dist && sha256sum * > SHA256SUMS.txt)
          echo "RELEASE_TITLE=Telegram ${VN} (${VC})" >> "$GITHUB_ENV"
          echo "APK_NAME=${NAME}" >> "$GITHUB_ENV"
          ls -lh dist/
          {
            echo "### 构建完成（方案A 无混淆）"
            echo "- 版本 ${VN} (${VC})，commit ${SHA}"
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ── 6. Artifact（Node24 版本）──
      - name: 上传构建产物（Artifact）
        uses: actions/upload-artifact@v5
        with:
          name: telegram-apk
          path: dist/
          if-no-files-found: error
          retention-days: 14

      # ── 7. Release：tag 推送自动发；手动运行填了 tag 才发 ──
      - name: 确定 Release Tag
        id: rel
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: 同步到 GitHub Release
        if: steps.rel.outputs.tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ${{ env.RELEASE_TITLE }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          fail_on_unmatched_files: true
          body_path: dist/SHA256SUMS.txt
          generate_release_notes: true
          prerelease: ${{ contains(steps.rel.outputs.tag, '-') }}
