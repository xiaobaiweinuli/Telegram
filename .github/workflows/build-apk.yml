# Telegram Android — GitHub Actions：构建 3 个 APK（无混淆）并发布 Release
#
# 约束：不改仓库代码，本 yml 是唯一新增文件。构建时用 -I 注入 init 脚本 （$RUNNER_TEMP），运行时关闭各模块混淆与资源瘦身，不入库。
#
# 构建/发布：单次调用并行构建 主版/web/华为，校验齐全后一次性发布；
#   正文 = 4 列表格（直链 + SHA-256，写 $RUNNER_TEMP 不作资产）+ generate_release_notes 追加。
#
# 触发：tag 推送 / 手动 Run / push master / cron 每天两次（03:23、15:23 UTC，自动同步上游）
#   定时同步后按 master 头构建（check 把实际检出的 commit 传给 build）；github.sha 是触发快照，改不动
#   守卫：v<APP_VERSION_NAME> 已发布且含 ≥3 个 APK → 秒跳；半成品由下轮 cron 补齐
#   手动可填 build_ref = 上游 commit 哈希 → 按历史整树构建（回补漏建版本），留空 = 当前 commit
#
# 要点：NDK/CMake 靠 AGP 自动下载（实测 13s）；ccache 跨版本复用原生编译对象（init 注入套壳，
#   实测热缓存 43m→9m49s、命中 6913/13826）；ABI 默认 arm64-v8a，产物名带 -arm64/-armv7-arm64/-all
#   后缀且 lib 集合逐包自检；JVM "-Xmx4g -XX:MaxMetaspaceSize=1g"；actions 全 Node24；签名 = 仓库 keystore

name: Build Telegram APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - master
  schedule:
    - cron: '23 3,15 * * *'
  workflow_dispatch:
    inputs:
      publish_release:
        description: '发布 GitHub Release'
        type: boolean
        default: true
      build_ref:
        description: '构建指定commit（留空=当前 HEAD）'
        required: false
        default: ''
      abi:
        description: '目标 ABI（arm64=仅 arm64-v8a；all=仓库默认 4 ABI）'
        type: choice
        options:
          - arm64
          - arm64+armv7
          - all
        default: arm64

permissions:
  contents: write
  actions: write      # 删同名旧 ccache 缓存（缓存不可变，否则 save 永远被拒）

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── 轻量守卫 job：不构建时秒级结束 ──
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_build: ${{ steps.guard.outputs.should_build }}
      head_sha: ${{ steps.head.outputs.sha }}
    steps:
      # 仅定时触发：官方 Sync fork API（200=同步 / 409=冲突 / 422=其它，均只警告不中断；branch 走 body）
      - name: 同步上游（仅定时触发）
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -sS -o /tmp/sync.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            -d '{"branch":"master"}' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/merge-upstream")
          if [ "$code" = 200 ]; then
            echo "已从上游同步新提交:"; cat /tmp/sync.json
          elif [ "$code" = 409 ]; then
            echo "::warning::同步失败：与上游存在 merge conflict（409），需手动解决"
            cat /tmp/sync.json
          elif [ "$code" = 422 ]; then
            echo "::warning::同步失败：其它原因（422，如已是最新/未配置 upstream），继续走守卫"
            cat /tmp/sync.json
          else
            echo "::warning::sync 返回 $code（继续走守卫）"; cat /tmp/sync.json
          fi

      # 定时按分支头检出（master 已是同步后的头）；其余事件按触发 commit
      - name: 解析检出的 ref（定时=同步后的分支头，其余=触发 commit）
        id: ref
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            echo "ref=master" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.ref.outputs.ref }}
          fetch-depth: 1

      - name: 记录实际检出的 commit（供 build 复用，避免两边看到不同代码）
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: 版本守卫（上游发新版才构建）
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "手动触发 / tag 推送 → 总是构建（绕过版本守卫）"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VN="$(grep -m1 '^APP_VERSION_NAME=' gradle.properties | cut -d= -f2-)"
          # 半成品（上传中断/草稿/资产<3）放行重跑，softprops 幂等补齐；
          # 换 ABI 模式重发同版本会被跳过（≥3 已满足）→ 需先删该 Release（Release 名不含 ABI）
          row="$(gh release view "v${VN}" --json isDraft,assets \
                 --jq '[.isDraft, ([.assets[].name | select(endswith(".apk"))] | length)] | @tsv' \
                 2>/dev/null || true)"
          if [ -n "$row" ]; then
            is_draft="${row%%$'\t'*}"
            n_apk="${row##*$'\t'}"
          else
            is_draft=""
            n_apk=0
          fi
          if [ "$is_draft" = "false" ] && [ "${n_apk:-0}" -ge 3 ]; then
            echo "v${VN} 已正式发布且资产完整（${n_apk} 个 APK）→ 跳过构建"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "v${VN} 需要构建（Release=${row:-不存在}）→ 触发"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      CCACHE_DIR: /home/runner/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPILERCHECK: content
      CCACHE_NOHASHDIR: "1"
      CCACHE_SLOPPINESS: file_stat_matches,include_file_mtime,include_file_ctime,time_macros

    steps:
      # ── 1. 检出（build_ref 指定时 = 历史 commit 整树，版本命名自动跟随）──
      - name: 解析构建目标 commit（仅手动输入哈希时）
        id: findref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_REF_INPUT: ${{ github.event.inputs.build_ref }}
        run: |
          INPUT="$BUILD_REF_INPUT"
          if [ -z "$INPUT" ]; then
            echo "未指定 build_ref → 构建当前触发的 commit"
            echo "sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! printf '%s' "$INPUT" | grep -Eq '^[0-9a-f]{7,40}$'; then
            echo "::error::build_ref 只接受 commit 哈希（7-40 位十六进制，版本号已不支持；到上游 commits 页复制）。收到：${INPUT}"
            exit 1
          fi
          # 存在性预检：1 次 API 调用
          if ! gh api "repos/${GITHUB_REPOSITORY}/commits/${INPUT}" --jq .sha > /tmp/target-sha 2>/tmp/sha.err; then
            echo "::error::commit ${INPUT} 在本仓库历史中不存在（上游分支的提交需先经 cron 同步进来）"
            head -3 /tmp/sha.err || true
            exit 1
          fi
          echo "构建目标：$(cat /tmp/target-sha)"
          echo "sha=$(cat /tmp/target-sha)" >> "$GITHUB_OUTPUT"

      - name: Checkout（含全部子模块）
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.findref.outputs.sha || needs.check.outputs.head_sha || github.sha }}
          fetch-depth: 1
          submodules: recursive

      - name: 子模块二次保险
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1

      # ── 2. JDK 17 + Gradle 缓存 ──
      - name: 设置 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 缓存：非默认分支/tag 只读；key 含内容哈希、靠前缀恢复；cleanup=always + 排除 build-cache-1 控体积
      - name: 设置 Gradle（依赖与构建缓存）
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: always
          gradle-home-cache-excludes: |
            caches/build-cache-1

      # ccache：跨版本复用原生编译对象（安装 → 恢复缓存 → 构建后统计/保存）
      - name: 安装 ccache
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ccache
          ccache --version | head -1
          mkdir -p "$CCACHE_DIR"

      - name: 恢复 ccache 缓存
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-ndk27.2-${{ hashFiles('TMessagesProj/jni/**', 'TMessagesProj/**/CMakeLists.txt') }}
          restore-keys: |
            ccache-${{ runner.os }}-ndk27.2-

      # ── 3. 构建期注入（都不入库，仓库源码保持干净）──
      #   ① init 脚本：关混淆/资源瘦身 + ccache 套壳 + ABI 收窄
      #   ② 版本号点击补丁：第一次点击弹窗（打开项目主页 / 调试菜单）
      - name: 生成 CI 注入脚本
        shell: bash
        env:
          NO_MINIFY_INIT: ${{ runner.temp }}/no-minify.init.gradle
        run: |
          cat > "$NO_MINIFY_INIT" <<'GROOVY'
          // 运行时注入，不改仓库代码：①关各模块混淆/资源瘦身 ②native 构建套 ccache
          gradle.beforeProject { proj ->
              proj.afterEvaluate {
                  if (proj.plugins.hasPlugin('com.android.application')) {
                      proj.android.buildTypes.all { bt ->
                          bt.minifyEnabled = false
                          bt.shrinkResources = false
                          println("[no-minify] ${proj.path} : ${bt.name}")
                      }
                  }
                  if (proj.plugins.hasPlugin('com.android.application') || proj.plugins.hasPlugin('com.android.library')) {
                      proj.android.defaultConfig.externalNativeBuild.cmake.arguments(
                          '-DCMAKE_C_COMPILER_LAUNCHER=ccache',
                          '-DCMAKE_CXX_COMPILER_LAUNCHER=ccache'
                      )
                      println("[ccache] ${proj.path}")
                      // 按 CI_ABI 收窄 ABI（空 = 保持仓库默认 4 ABI）
                      def wantAbi = System.getenv('CI_ABI')
                      if (wantAbi) {
                          def abis = wantAbi.split(',') as Set
                          // defaultConfig：覆盖没有 flavor 的模块（TMessagesProj 库承载全部原生编译，
                          //   它没有 productFlavors，只写 flavor 分支会空转 → 4 个 ABI 全编）
                          proj.android.defaultConfig.ndk.abiFilters.clear()
                          abis.each { proj.android.defaultConfig.ndk.abiFilters.add(it) }
                          // 有 flavor 的模块：flavor 会覆盖 defaultConfig，必须逐个再设一遍
                          proj.android.productFlavors.all { f ->
                              f.ndk.abiFilters.clear()
                              abis.each { f.ndk.abiFilters.add(it) }
                          }
                          println("[abi] ${proj.path} -> ${wantAbi}")
                      }
                  }
              }
          }
          GROOVY
          echo "已生成 $NO_MINIFY_INIT:"
          cat "$NO_MINIFY_INIT"

      # 锚点 = 版本行"第一次点击只弹提示"那行；第二次点击的 openDebugMenu() 原样保留
      - name: 注入版本号点击弹窗（构建期打补丁，不入库）
        shell: bash
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          F=TMessagesProj/src/main/java/org/telegram/ui/SettingsActivity.java
          ANCHOR='Toast.makeText(getParentActivity(), getString(R.string.DebugMenuLongPress), Toast.LENGTH_SHORT).show();'
          if [ "$(grep -cF "$ANCHOR" "$F")" != "1" ]; then
            echo "::error::SettingsActivity 版本号锚点未唯一命中（上游可能改过这段），中止构建"
            exit 1
          fi
          python3 - "$F" "$REPO_URL" <<'PY'
          import sys
          path, url = sys.argv[1], sys.argv[2]
          anchor = 'Toast.makeText(getParentActivity(), getString(R.string.DebugMenuLongPress), Toast.LENGTH_SHORT).show();'
          ind = ' ' * 20
          lines = [
              'AlertDialog.Builder builder = new AlertDialog.Builder(getParentActivity(), resourceProvider);',
              'builder.setItems(new CharSequence[]{"打开项目主页", "调试菜单"}, (dialog, which) -> {',
              '    if (which == 0) org.telegram.messenger.browser.Browser.openUrl(getParentActivity(), "%s");' % url,
              '    else openDebugMenu();',
              '});',
              'builder.show();',
          ]
          # 锚点文本不含行首缩进：首行沿用原缩进，其余行补 20 空格
          code = lines[0] + '\n' + '\n'.join(ind + l for l in lines[1:])
          src = open(path, encoding='utf-8').read()
          open(path, 'w', encoding='utf-8').write(src.replace(anchor, code, 1))
          print('[inject] 版本号点击 -> 弹窗（打开项目主页 / 调试菜单），URL = %s' % url)
          PY
          grep -qF '打开项目主页' "$F" || { echo "::error::注入失败，未写入"; exit 1; }
          grep -n -A5 '打开项目主页' "$F" | head -8

      - name: chmod gradlew
        run: chmod +x gradlew

      # ── 4. 解析目标 ABI（arm64=仅 arm64-v8a；all=留空→仓库默认 4 ABI；无输入=cron/push/tag 取默认 arm64）──
      - name: 解析目标 ABI
        id: abi
        shell: bash
        env:
          ABI_INPUT: ${{ github.event.inputs.abi }}
        run: |
          case "$ABI_INPUT" in
            ""|"arm64")    A="arm64-v8a"; S="-arm64" ;;
            "arm64+armv7") A="arm64-v8a,armeabi-v7a"; S="-armv7-arm64" ;;
            "all")         A=""; S="-all" ;;
            *) echo "::error::未知 abi 选项：${ABI_INPUT}"; exit 1 ;;
          esac
          echo "CI_ABI=$A" >> "$GITHUB_ENV"          # 供 init 注入收窄、供 ABI 自检
          echo "ABI_SUFFIX=$S" >> "$GITHUB_ENV"     # 供产物命名标注
          echo "目标 ABI：${A:-（仓库默认 4 ABI）}，后缀 ${S}"

      # ── 5. 确定 Release tag（取自代码版本号；导出 RELEASE_TAG 供正文直链）──
      - name: 确定 Release Tag
        id: rel
        shell: bash
        env:
          PUBLISH_RELEASE_INPUT: ${{ github.event.inputs.publish_release }}
        run: |
          T=""
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            T="$GITHUB_REF_NAME"
          elif [ "$PUBLISH_RELEASE_INPUT" = "false" ]; then
            T=""    # 手动取消勾选"发布" → 不发 Release
          else
            # 手动/push/定时 → Release 名 = v<代码里的 APP_VERSION_NAME>
            VN="$(grep -m1 '^APP_VERSION_NAME=' gradle.properties | cut -d= -f2-)"
            T="v${VN}"
            # 派生 tag 同样过字符校验：上游版本名含怪字符时在此早失败、错误清晰
            if ! printf '%s' "$T" | grep -Eq '^[A-Za-z0-9._/-]+$'; then
              echo "::error::版本号派生的 tag 非法（仅允许 字母/数字/. _ - /）：${T}"
              exit 1
            fi
          fi
          echo "tag=$T" >> "$GITHUB_OUTPUT"
          echo "RELEASE_TAG=$T" >> "$GITHUB_ENV"   # 未发布时为空 → 打包回退纯文本

      # ── 6. 构建：单次调用并行三任务（自签：向命令追加 -PRELEASE_*="${{ secrets.… }}"）──
      - name: 构建主版 / web 版 / 华为版（方案A 无混淆）
        env:
          NO_MINIFY_INIT: ${{ runner.temp }}/no-minify.init.gradle
        run: |
          set -o pipefail
          ./gradlew --stacktrace \
            -I "$NO_MINIFY_INIT" \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" \
            :TMessagesProj_App:assembleAfatRelease \
            :TMessagesProj_AppStandalone:assembleAfatStandalone \
            :TMessagesProj_AppHuawei:assembleAfatRelease \
            2>&1 | tee gradle-build.log

      - name: ccache 统计（命中率观测）
        if: always()
        run: ccache -s || true

      # ccache 缓存不可变：同名条目一旦存在，后续 save 一律被拒（日志里的 "Failed to save"），
      # 命中率就永远停在首次那份 → 保存前先删同名条目，让本次成果能写进去
      - name: 删除同名旧 ccache 缓存
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_KEY: ccache-${{ runner.os }}-ndk27.2-${{ hashFiles('TMessagesProj/jni/**', 'TMessagesProj/**/CMakeLists.txt') }}
        run: |
          if gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/caches?key=${CACHE_KEY}" >/dev/null 2>&1; then
            echo "已删除同名旧 ccache 缓存：${CACHE_KEY}"
          else
            echo "无同名旧缓存可删（首次运行属正常），继续保存"
          fi

      - name: 保存 ccache 缓存
        if: always()
        uses: actions/cache/save@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-ndk27.2-${{ hashFiles('TMessagesProj/jni/**', 'TMessagesProj/**/CMakeLists.txt') }}

      - name: 失败时输出 CMake/Ninja 日志
        if: failure()
        run: |
          echo "=== CMake / Ninja logs ==="
          find TMessagesProj/.cxx -type f \( -name '*.log' -o -name '*.txt' \) 2>/dev/null \
            | head -n 20 | while IFS= read -r f; do echo "--- $f ---"; tail -n 100 "$f"; done

      # ── 7. 打包：三产物齐全才放行 + 逐模块断言；正文 4 列表格写 $RUNNER_TEMP（只当 body、无 SUMS）──
      - name: 打包产物
        id: pkg
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # 自检：init 必须为 3 个 application 模块各打印过 [no-minify]
          for m in ':TMessagesProj_App' ':TMessagesProj_AppStandalone' ':TMessagesProj_AppHuawei'; do
            if ! grep -q "\[no-minify\] ${m} " gradle-build.log; then
              echo "::error::方案A init 脚本未覆盖模块 ${m}（gradle-build.log 无 [no-minify]）"
              exit 1
            fi
          done
          echo "自检通过：3 个模块均已关闭混淆"

          # ccache 注入自检（仅警告：属优化项，不影响产物正确性）
          grep -qE '\[ccache\] :TMessagesProj$' gradle-build.log \
            || echo "::warning::init 未向 TMessagesProj 注入 ccache 套壳（构建仍有效，但未加速）"

          # ABI 收窄自检（仅警告）：① init 是否打印 [abi] ② 实际编译的 ABI 是否只剩请求的
          #（APK 内 lib 集合在下方 dist 上做最终裁决；这里查的是"有没有白编别的 ABI"）
          if [ -n "${CI_ABI:-}" ]; then
            grep -qE "\[abi\] :TMessagesProj -> " gradle-build.log \
              || echo "::warning::init 未打印 [abi] 行（ABI 收窄可能未生效）"
            want="$(printf '%s' "$CI_ABI" | tr ',' '\n' | sort | paste -sd, -)"
            built="$(grep -oE 'configureCMake[A-Za-z]+\[[a-z0-9_-]+\]' gradle-build.log \
                     | sed 's/.*\[//; s/\]$//' | sort -u | paste -sd, - || true)"
            if [ -z "$built" ]; then
              echo "::warning::日志里没有 configureCMake 任务行，跳过编译层 ABI 自检"
            elif [ "$built" != "$want" ]; then
              echo "::warning::实际编译的 ABI [${built}] ≠ 请求 [${want}]（多编的 ABI 白耗构建时间）"
            else
              echo "编译层 ABI 自检通过：${built}"
            fi
          fi

          VN="$(grep -m1 '^APP_VERSION_NAME=' gradle.properties | cut -d= -f2-)"
          VC="$(grep -m1 '^APP_VERSION_CODE=' gradle.properties | cut -d= -f2-)"
          SHA="$(git rev-parse --short HEAD)"
          NAME="telegram-${VN}-${VC}-${SHA}${ABI_SUFFIX:-}"
          # 三个产物各自输出路径，供下面三个 Artifact 步骤精确引用
          echo "main=${NAME}.apk" >> "$GITHUB_OUTPUT"
          echo "web=${NAME}-web.apk" >> "$GITHUB_OUTPUT"
          echo "huawei=${NAME}-huawei.apk" >> "$GITHUB_OUTPUT"
          mkdir -p dist

          req() {
            if [ -f "$1" ]; then
              cp "$1" "dist/$2"
            else
              echo "::error::缺少产物 $2（预期路径：$1）"
              find "$(dirname "$1")/.." -type f 2>/dev/null | head -n 30 >&2 || true
              return 1
            fi
          }
          req "TMessagesProj_App/build/outputs/apk/afat/release/app.apk"             "${NAME}.apk"
          req "TMessagesProj_AppStandalone/build/outputs/apk/afat/standalone/app.apk" "${NAME}-web.apk"
          req "TMessagesProj_AppHuawei/build/outputs/apk/afat/release/app-huawei.apk" "${NAME}-huawei.apk"

          # ABI 自检：APK 内 lib 目录集合必须与请求一致（防注入失效却照发）
          if [ -n "${CI_ABI:-}" ]; then
            exp="$(printf '%s' "$CI_ABI" | tr ',' '\n' | sort | paste -sd, -)"
            for f in dist/*.apk; do
              act="$(unzip -l "$f" | grep -oE 'lib/[^/]+/' | sort -u | sed 's|lib/||; s|/$||' | paste -sd, - || true)"
              if [ "$act" != "$exp" ]; then
                echo "::error::ABI 不符（$(basename "$f")）：实际 [${act}] ≠ 请求 [${exp}]"
                exit 1
              fi
            done
            echo "ABI 自检通过：${exp}"
          fi

          # 表格行：文件（有 RELEASE_TAG 拼直链，否则纯文本）| 包名 | 说明 | SHA-256
          row() {
            local f="$1" pkg="$2" desc="$3" cell h
            [ -f "dist/$f" ] || return 0
            h="$(sha256sum "dist/$f" | cut -d' ' -f1)"
            if [ -n "${RELEASE_TAG:-}" ]; then
              cell="[\`$f\`](https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/$f)"
            else
              cell="\`$f\`"
            fi
            echo "| $cell | $pkg | $desc | \`$h\` |"
          }
          NOTES="$RUNNER_TEMP/RELEASENOTES.md"
          {
            echo "# Telegram ${VN} (${VC})"
            echo
            echo "- commit: \`${SHA}\`"
            echo "- 构建形态：无混淆（R8 全关）· ABI：${CI_ABI:-仓库默认 4 ABI} · 签名 = 仓库 release.keystore"
            # 提交列表走 API：浅克隆（fetch-depth 1）下 git log 只看得到 1 条提交
            UP="$(gh api "repos/${GITHUB_REPOSITORY}/commits?sha=${SHA}&per_page=20" \
                  --jq '[.[] | select(.commit.message | startswith("update to ")) | (.commit.message | split("\n")[0]) + "|" + .sha[0:7]] | first // empty' \
                  2>/dev/null || true)"
            if [ -n "$UP" ]; then
              echo "- 上游变更：${UP%%|*}（${UP##*|}）"
            fi
            echo
            echo "| 文件 | 包名 | 说明 | SHA-256 |"
            echo "|---|---|---|---|"
            row "${NAME}.apk"        "org.telegram.messenger"      "主版"
            row "${NAME}-web.apk"    "org.telegram.messenger.web"  "独立包名，可与主版并存"
            row "${NAME}-huawei.apk" "org.telegram.messenger"      "华为渠道（HMS），与主版同包名互相覆盖"
          } > "$NOTES"

          echo "RELEASE_TITLE=Telegram ${VN} (${VC})" >> "$GITHUB_ENV"
          ls -lh dist/
          {
            echo "### 构建完成"
            echo "- 版本 ${VN} (${VC})，commit \`${SHA}\`，APK：$(ls dist/*.apk | wc -l)/3"
            echo "- Release tag：${RELEASE_TAG:-（本次未发布）}"
            echo '```'
            (cd dist && sha256sum *.apk)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ── 8. 单次发布（generate_release_notes 追加于正文后）──
      - name: 发布 Release
        if: steps.rel.outputs.tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ${{ env.RELEASE_TITLE }}
          target_commitish: ${{ steps.findref.outputs.sha || needs.check.outputs.head_sha || github.sha }}
          prerelease: ${{ contains(steps.rel.outputs.tag, '-') }}
          files: dist/*
          fail_on_unmatched_files: true
          body_path: ${{ runner.temp }}/RELEASENOTES.md
          generate_release_notes: true

      # ── 9. Artifact：三个 APK 分开传（下载时按需取，不用下整包 140MB）──
      #    保留 3 天；overwrite 防止重跑同一 run 时重名报错
      - name: 上传构建产物（主版）
        if: ${{ !cancelled() && steps.pkg.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: telegram-apk-main
          path: dist/${{ steps.pkg.outputs.main }}
          if-no-files-found: error
          overwrite: true
          retention-days: 3

      - name: 上传构建产物（web 版）
        if: ${{ !cancelled() && steps.pkg.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: telegram-apk-web
          path: dist/${{ steps.pkg.outputs.web }}
          if-no-files-found: error
          overwrite: true
          retention-days: 3

      - name: 上传构建产物（华为版）
        if: ${{ !cancelled() && steps.pkg.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: telegram-apk-huawei
          path: dist/${{ steps.pkg.outputs.huawei }}
          if-no-files-found: error
          overwrite: true
          retention-days: 3
