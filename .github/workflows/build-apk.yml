# Telegram Android — GitHub Actions：构建 APK（方案A 无混淆）并同步到 GitHub Release
name: Build Telegram APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - master
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      publish_release:
        description: '发布 GitHub Release'
        type: boolean
        default: true
      tag:
        description: '自定义 Release tag（留空 = 自动 v<版本名>，当前即 v12.10.6）'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── 甲/乙：轻量守卫 job（不同步不构建时秒级结束，不装 JDK 不拉子模块）──
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_build: ${{ steps.guard.outputs.should_build }}
    steps:
      # 乙：仅定时触发时调 GitHub 官方 Sync fork API（等价网页 Update branch）
      #     响应码按官方状态表（docs.github.com "Sync a fork branch" 原文）：
      #     200=同步成功；409=merge conflict 无法同步；422=其它原因无法同步
      #     （含已是最新 / 未配置 upstream 等）——409 绝不是"已是最新"
      #     请求用官方现行 body 形态（当前文档 branch 为 body 参数，非路径参数）
      - name: 同步上游（仅定时触发）
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -sS -o /tmp/sync.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            -d '{"branch":"master"}' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/merge-upstream")
          if [ "$code" = 200 ]; then
            echo "已从上游同步新提交:"; cat /tmp/sync.json
          elif [ "$code" = 409 ]; then
            echo "::warning::同步失败：与上游存在 merge conflict（409），需手动解决，否则自动同步持续受阻"
            cat /tmp/sync.json
          elif [ "$code" = 422 ]; then
            echo "::warning::同步失败：其它原因（422，如已是最新/未配置 upstream），继续走版本守卫"
            cat /tmp/sync.json
          else
            echo "::warning::sync 返回 $code（继续走版本守卫）"; cat /tmp/sync.json
          fi

      # 同步后重新检出以拿到最新代码；守卫只读 gradle.properties，不需子模块/JDK
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: 版本守卫（上游发新版才构建）
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "手动触发 / tag 推送 → 总是构建（绕过版本守卫）"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VN="$(grep -m1 '^APP_VERSION_NAME=' gradle.properties | cut -d= -f2-)"
          # gh release view 能解析到 draft；只有"正式发布"（isDraft=false）才让守卫跳过，
          # 否则手动占位的草稿会把守卫永久卡死、cron 每小时空转烧构建
          state="$(gh release view "v${VN}" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [ "$state" = "false" ]; then
            echo "v${VN} 已正式发布 → 跳过构建"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "v${VN} 未正式发布（状态：${state:-无此 Release}）→ 触发构建"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      # ── 1. 代码与全部子模块（media 模块 / jlatexmath 是 Gradle 配置期依赖，缺一不可）──
      - name: Checkout（含全部子模块）
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: recursive

      - name: 子模块二次保险（forkgram/Qorvhex 做法）
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1

      # ── 2. JDK 17 + Gradle 官方缓存（Node24）──
      - name: 设置 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      #     单仓库缓存上限 10GB、7 天未访问淘汰 → 用 cleanup + 排除项控制体积防 LRU 淘汰
      #   - 排除 build-cache-1：本地 build cache 对一次性 CI 构建价值最低、体积最大
      #   - cache-cleanup: always：失败的运行也先清理再写，避免缓存只进不出
      #   - setup-java 故意不配 cache: gradle：与本步骤叠加会双写同一缓存区（官方不建议）
      - name: 设置 Gradle（依赖与构建缓存）
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: always
          gradle-home-cache-excludes: |
            caches/build-cache-1

      # ── 3. 方案A：生成"无混淆" init 脚本（运行时注入，仓库文件零改动）──
      - name: 生成方案A 无混淆 init 脚本
        shell: bash
        env:
          NO_MINIFY_INIT: ${{ runner.temp }}/no-minify.init.gradle
        run: |
          cat > "$NO_MINIFY_INIT" <<'GROOVY'
          // 方案A：CI 运行时关闭代码混淆与资源瘦身，不修改仓库代码。
          // 在 beforeProject 中注册 afterEvaluate，保证先于 AGP 的变体创建执行，
          // 把所有 application 模块各 buildType 的 minifyEnabled/shrinkResources 覆盖为 false。
          gradle.beforeProject { proj ->
              proj.afterEvaluate {
                  if (proj.plugins.hasPlugin('com.android.application')) {
                      proj.android.buildTypes.all { bt ->
                          bt.minifyEnabled = false
                          bt.shrinkResources = false
                          println("[no-minify] ${proj.path} : ${bt.name}")
                      }
                  }
              }
          }
          GROOVY
          echo "已生成 $NO_MINIFY_INIT:"
          cat "$NO_MINIFY_INIT"

      - name: chmod gradlew
        run: chmod +x gradlew

      # ── 4. 构建：主版 / web 版 / 华为版（均为官方 Dockerfile 验证过的任务）──
      # 换用自己的签名时：把 gradle.properties 里的明文密码改成
      # -PRELEASE_STORE_PASSWORD="${{ secrets.… }}" 形式追加到下面命令即可
      - name: 构建主版 / web 版 / 华为版（方案A 无混淆）
        env:
          NO_MINIFY_INIT: ${{ runner.temp }}/no-minify.init.gradle
        run: |
          set -o pipefail
          ./gradlew --stacktrace \
            -I "$NO_MINIFY_INIT" \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" \
            :TMessagesProj_App:assembleAfatRelease \
            :TMessagesProj_AppStandalone:assembleAfatStandalone \
            :TMessagesProj_AppHuawei:assembleAfatRelease \
            2>&1 | tee gradle-build.log

      - name: 失败时输出 CMake / Ninja 日志（Qorvhex 做法）
        if: failure()
        run: |
          echo "=== CMake / Ninja logs ==="
          find TMessagesProj/.cxx -type f \( -name '*.log' -o -name '*.txt' \) 2>/dev/null \
            | head -n 20 | while IFS= read -r f; do echo "--- $f ---"; tail -n 100 "$f"; done

      # ── 5. 打包：主/web/华为 必须存在（Telegraher 式 verify）；
      #      方案A 自检：gradle-build.log 逐模块断言 [no-minify]（init 注入的正向证据，
      #      比查 mapping.txt 更强——后者只覆盖主版且属间接推断）──
      - name: 打包产物
        shell: bash
        run: |
          set -euo pipefail

          # 方案A 自检：init 脚本必须为 3 个 application 模块各打印过 [no-minify]
          for m in ':TMessagesProj_App' ':TMessagesProj_AppStandalone' ':TMessagesProj_AppHuawei'; do
            if ! grep -q "\[no-minify\] ${m} " gradle-build.log; then
              echo "::error::方案A init 脚本未覆盖模块 ${m}（gradle-build.log 中未找到 [no-minify]）"
              exit 1
            fi
          done
          echo "方案A 自检通过：3 个模块均已关闭混淆"

          VN="$(grep -m1 '^APP_VERSION_NAME=' gradle.properties | cut -d= -f2-)"
          VC="$(grep -m1 '^APP_VERSION_CODE=' gradle.properties | cut -d= -f2-)"
          SHA="$(git rev-parse --short HEAD)"
          NAME="telegram-${VN}-${VC}-${SHA}"
          mkdir -p dist

          req() {
            if [ -f "$1" ]; then
              cp "$1" "dist/$2"
            else
              echo "::error::缺少产物 $2（预期路径：$1）"
              find "$(dirname "$1")/.." -type f 2>/dev/null | head -n 30 >&2 || true
              return 1
            fi
          }
          req "TMessagesProj_App/build/outputs/apk/afat/release/app.apk"             "${NAME}.apk"
          req "TMessagesProj_AppStandalone/build/outputs/apk/afat/standalone/app.apk" "${NAME}-web.apk"
          req "TMessagesProj_AppHuawei/build/outputs/apk/afat/release/app-huawei.apk" "${NAME}-huawei.apk"

          # 只对 APK 求哈希：*.apk 避免把 SHA256SUMS.txt 自己算进去（防御性，即使同目录重跑也稳）
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

          # Release 正文（body_path 指向它）：版本/commit/三包说明 + SHA-256 表；
          # generate_release_notes 会在其后追加 GitHub 自动生成的变更列表
          {
            echo "# Telegram ${VN} (${VC})"
            echo
            echo "- commit: \`${SHA}\`"
            echo "- 构建形态：方案A 无混淆（R8 全关）· 4 ABI fat APK · 签名 = 仓库 release.keystore"
            echo
            echo "| 文件 | 包名 | 说明 |"
            echo "|---|---|---|"
            echo "| \`${NAME}.apk\` | org.telegram.messenger | 主版 |"
            echo "| \`${NAME}-web.apk\` | org.telegram.messenger.web | 独立包名，可与主版并存 |"
            echo "| \`${NAME}-huawei.apk\` | org.telegram.messenger | 华为渠道（HMS），与主版同包名互相覆盖 |"
            echo
            echo "## SHA-256"
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } > dist/RELEASENOTES.md

          echo "RELEASE_TITLE=Telegram ${VN} (${VC})" >> "$GITHUB_ENV"
          ls -lh dist/
          {
            echo "### 构建完成（方案A 无混淆）"
            echo "- 版本 ${VN} (${VC})，commit ${SHA}"
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ── 6. Artifact（Node24 版本）──
      - name: 上传构建产物（Artifact）
        uses: actions/upload-artifact@v7
        with:
          name: telegram-apk
          path: dist/
          if-no-files-found: error
          retention-days: 3

      # ── 7. Release：tag/push/定时/手动均自动发 v<APP_VERSION_NAME>；仅手动取消 publish 才不发 ──
      - name: 确定 Release Tag
        id: rel
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.inputs.publish_release }}" = "false" ]; then
            # 仅手动运行时明确取消勾选"发布"才不发 Release
            echo "tag=" >> "$GITHUB_OUTPUT"
          else
            # 手动默认 / push 分支 / 定时任务 → 自动 v<APP_VERSION_NAME>
            VN="$(grep -m1 '^APP_VERSION_NAME=' gradle.properties | cut -d= -f2-)"
            INPUT_TAG="${{ github.event.inputs.tag }}"
            if [ -z "$INPUT_TAG" ]; then
              echo "tag=v${VN}" >> "$GITHUB_OUTPUT"
            elif printf '%s' "$INPUT_TAG" | grep -Eq '^[A-Za-z0-9._/-]+$'; then
              # 前置校验自定义 tag，避免非法字符拖到上传资产阶段才失败
              echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
            else
              echo "::error::自定义 tag 含非法字符（仅允许 字母/数字/. _ - /）：${INPUT_TAG}"
              exit 1
            fi
          fi

      - name: 同步到 GitHub Release
        if: steps.rel.outputs.tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ${{ env.RELEASE_TITLE }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          fail_on_unmatched_files: true
          body_path: dist/RELEASENOTES.md
          generate_release_notes: true
          prerelease: ${{ contains(steps.rel.outputs.tag, '-') }}
